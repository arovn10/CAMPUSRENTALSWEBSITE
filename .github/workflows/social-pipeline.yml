name: Instagram Pipeline

# Drives the @campusrentalsllc content pipeline. Three independent jobs:
#
#   generate — refills the review queue from listings, photos and editorial
#              topics. Publishes nothing; its output is drafts awaiting a human.
#   publish  — sends at most ONE human-approved post. A no-op unless someone
#              approved something AND SOCIAL_PUBLISHING_ENABLED is "true".
#   insights — snapshots per-media engagement and the follower count.
#
# Target cadence is THREE POSTS A WEEK, Mon/Wed/Fri (Alec, 2026-11-20).
# Enforced three ways:
#   - generate (Sundays) drafts posts for specific Mon/Wed/Fri slots, and the
#     publisher will not send a post before its slot opens;
#   - publish runs only Mon/Wed/Fri evenings;
#   - the server caps publishing at 3 per rolling 168h with a 36h minimum gap,
#     which a manual run cannot bypass.
#
# Requires:
#   secret  CRON_SECRET   — must match the app's CRON_SECRET env var
#   var     APP_BASE_URL  — optional; defaults to https://campusrentalsllc.com
#
# Every endpoint is safe to re-run: generation dedupes on a unique sourceKey,
# publishing claims a row conditionally, insight writes are keyed per hour.

on:
  schedule:
    - cron: '0 15 * * 0' # Sundays 15:00 UTC — draft the coming Mon/Wed/Fri slots for review
    - cron: '30 23 * * 1,3,5' # Mon/Wed/Fri 23:30 UTC (5:30pm CST) — publish the slot's approved post
    - cron: '20 */6 * * *' # every 6h — engagement + follower snapshot
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run'
        type: choice
        options: [generate, publish, insights]
        default: generate

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Pick the endpoint for this trigger
        id: pick
        env:
          CRON: ${{ github.event.schedule }}
          MANUAL: ${{ github.event.inputs.job }}
        run: |
          if [ -n "$MANUAL" ]; then
            job="$MANUAL"
          else
            case "$CRON" in
              '0 15 * * 0')       job=generate ;;
              '30 23 * * 1,3,5')  job=publish ;;
              '20 */6 * * *') job=insights ;;
              *)                job=insights ;;
            esac
          fi
          echo "job=$job" >> "$GITHUB_OUTPUT"
          echo "Running: $job"

      - name: Call the pipeline endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: ${{ vars.APP_BASE_URL || 'https://campusrentalsllc.com' }}
          JOB: ${{ steps.pick.outputs.job }}
        run: |
          # A missing secret means the pipeline has not been activated yet
          # (Meta setup is owner-gated). Same treatment as a server 503: warn,
          # don't fail. 198 red runs between 2026-09-21 and 2026-11-20 were
          # this and nothing else, and they were drowning real failures.
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET secret is not set — pipeline not activated yet, skipping."
            exit 0
          fi
          echo "POST $BASE_URL/api/cron/social-$JOB"
          code=$(curl -s -o /tmp/out -w "%{http_code}" --max-time 280 \
            -X POST "$BASE_URL/api/cron/social-$JOB" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}' || echo 000)
          echo "HTTP $code"
          cat /tmp/out
          echo ""
          # 503 means the feature is intentionally not configured yet (no
          # CRON_SECRET on the server, or credentials absent) — not a failure
          # worth a red run while the pipeline is still being set up.
          if [ "$code" = "503" ]; then
            echo "::warning::Pipeline not configured yet (HTTP 503)"
            exit 0
          fi
          if [ "$code" != "200" ]; then
            echo "::error::social-$JOB returned HTTP $code"
            exit 1
          fi
